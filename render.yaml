services:
  - type: web
    name: kabla-ya-daktari-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INTAKE_SHARED_SECRET
        sync: false
      - key: CLAUDE_MODEL
        sync: false
