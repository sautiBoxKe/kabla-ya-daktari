<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabla ya Daktari</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f5f2; margin: 0; padding: 24px; color: #1c1b19; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #6b6a66; font-size: 0.9rem; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e6e4de; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  select, button { font-size: 1rem; padding: 8px 12px; border-radius: 8px; border: 1px solid #cfcdc6; background: #fff; }
  button { background: #1c1b19; color: #fff; border: none; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .urgent { border-color: #c0392b; background: #fdf1ef; }
  .urgent-badge { display: inline-block; background: #c0392b; color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; }
  .field { margin-bottom: 10px; }
  .field b { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: #8a8880; margin-bottom: 2px; }
  ul { margin: 4px 0; padding-left: 18px; }
  .disclaimer { font-size: 0.8rem; color: #8a8880; margin-top: 12px; border-top: 1px solid #e6e4de; padding-top: 10px; }
  .empty { color: #8a8880; font-style: italic; }
  #status { color: #8a8880; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kabla ya Daktari</h1>
  <div class="sub">Pre-consult brief, generated from the patient's WhatsApp intake chat.</div>

  <div class="row">
    <select id="phoneSelect"><option value="">Loading sessions…</option></select>
    <button id="refreshBtn">Refresh list</button>
    <button id="reportBtn" disabled>Generate / refresh report</button>
  </div>
  <div id="status"></div>

  <div id="reportArea"></div>
</div>

<script>
const phoneSelect = document.getElementById('phoneSelect');
const reportBtn = document.getElementById('reportBtn');
const refreshBtn = document.getElementById('refreshBtn');
const statusEl = document.getElementById('status');
const reportArea = document.getElementById('reportArea');

async function loadSessions() {
  statusEl.textContent = 'Loading sessions…';
  const res = await fetch('/sessions');
  const sessions = await res.json();
  const prev = phoneSelect.value;
  phoneSelect.innerHTML = '';
  if (sessions.length === 0) {
    phoneSelect.innerHTML = '<option value="">No sessions yet — send a message first</option>';
    reportBtn.disabled = true;
    statusEl.textContent = '';
    return;
  }
  for (const s of sessions) {
    const opt = document.createElement('option');
    opt.value = s.phone;
    opt.textContent = `${s.phone} (${s.message_count} msgs${s.has_report ? ', report ready' : ''})`;
    phoneSelect.appendChild(opt);
  }
  if (sessions.some(s => s.phone === prev)) phoneSelect.value = prev;
  reportBtn.disabled = false;
  statusEl.textContent = '';
}

function field(label, value) {
  const isEmpty = !value || (Array.isArray(value) && value.length === 0);
  const body = isEmpty
    ? '<span class="empty">not mentioned</span>'
    : Array.isArray(value)
      ? `<ul>${value.map(v => `<li>${escapeHtml(v)}</li>`).join('')}</ul>`
      : escapeHtml(value);
  return `<div class="field"><b>${label}</b>${body}</div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderReport(r) {
  const urgentClass = r.urgent ? 'card urgent' : 'card';
  const urgentBadge = r.urgent ? '<div class="urgent-badge">⚠ Seek care immediately</div>' : '';
  const mockBadge = r._mock ? '<div class="urgent-badge" style="background:#8a8880;">MOCK — no ANTHROPIC_API_KEY set</div>' : '';
  reportArea.innerHTML = `
    <div class="${urgentClass}">
      ${urgentBadge}${mockBadge}
      ${field('Chief complaint', r.chief_complaint)}
      ${field('Duration', r.duration)}
      ${field('Symptoms', r.symptoms)}
      ${field('Self-reported vitals', [r.self_reported_vitals?.temperature, r.self_reported_vitals?.other].filter(Boolean).join(', '))}
      ${field('Current medications', r.current_medications)}
      ${field('Allergies', r.allergies)}
      ${field('Relevant history', r.relevant_history)}
      ${field('Red flags', r.red_flags)}
      ${field('Summary for doctor', r.summary_for_doctor)}
      <div class="disclaimer">${escapeHtml(r.disclaimer || '')}<br>Generated ${escapeHtml(r.generated_at || '')}</div>
    </div>
  `;
}

async function loadExistingReport(phone) {
  const res = await fetch(`/report/${encodeURIComponent(phone)}`);
  if (res.ok) renderReport(await res.json());
  else reportArea.innerHTML = '';
}

phoneSelect.addEventListener('change', () => {
  if (phoneSelect.value) loadExistingReport(phoneSelect.value);
});

refreshBtn.addEventListener('click', loadSessions);

reportBtn.addEventListener('click', async () => {
  const phone = phoneSelect.value;
  if (!phone) return;
  statusEl.textContent = 'Asking Claude to generate the brief…';
  reportBtn.disabled = true;
  try {
    const res = await fetch(`/report/${encodeURIComponent(phone)}`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    renderReport(await res.json());
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = 'Failed: ' + e.message;
  } finally {
    reportBtn.disabled = false;
    loadSessions();
  }
});

loadSessions();
setInterval(loadSessions, 4000);
</script>
</body>
</html>
